name: CI & Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, intl, bcmath
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies & build production assets
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Run automated PHPUnit test suite
        run: php artisan test --compact

      - name: Upload built Vite assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1

  deploy:
    name: Clean Deploy to Production VPS
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built Vite assets
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync ONLY production files to VPS (excluding PRD, agent files, .md, tests)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.mcp.json' \
            --exclude='.DS_Store' \
            --exclude='.editorconfig' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.phpunit.result.cache' \
            --exclude='PRD-Agent' \
            --exclude='project' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='public/uploads' \
            --exclude='public/hot' \
            --exclude='database/*.sqlite' \
            --exclude='*.md' \
            --exclude='boost.json' \
            --exclude='phpunit.xml' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Run production install, migrations, and cache optimization
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e
            cd "${{ secrets.VPS_PATH }}"
            mkdir -p storage/framework/{cache,sessions,views} storage/logs public/uploads/{avatars,company,portfolios,project-covers,site-visits,client-briefs}
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize
            php artisan storage:link || true
            sudo systemctl reload php8.4-fpm || true
          EOF
